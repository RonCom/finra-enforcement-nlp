[project]
name = "finra-enforcement-nlp"
version = "0.1.0"
description = "Rule classification and rulebook RAG on FINRA disciplinary actions"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finra_nlp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
